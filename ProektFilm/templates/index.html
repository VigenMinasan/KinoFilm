<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кино-Тиндер</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #121212;
      color: #fff;
      font-family: Arial;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 12px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #2a2a2a;
    }
    .header span { color: #4caf50; }

    .swipe-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 340px;
      background: #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease;
      user-select: none;
      touch-action: none;
      cursor: grab;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-info {
      padding: 12px;
      pointer-events: none;
    }

    .card-info h2 { font-size: 18px; margin-bottom: 4px; }
    .card-info p { font-size: 13px; color: #bbb; margin-bottom: 4px; }
    .card-info .rating { color: #ffc107; font-weight: bold; }

    .stamp {
      position: absolute;
      top: 40px;
      font-size: 26px;
      font-weight: bold;
      padding: 6px 14px;
      border: 3px solid;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
    }

    .stamp.like {
      left: 20px;
      color: #4caf50;
      border-color: #4caf50;
      transform: rotate(-20deg);
    }

    .stamp.nope {
      right: 20px;
      color: #ff5252;
      border-color: #ff5252;
      transform: rotate(20deg);
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #2a2a2a;
      background: #1a1a1a;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #888;
      text-decoration: none;
    }

    .nav-item .icon { font-size: 20px; display: block; }
    .nav-item.active { color: #4caf50; }
    .header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #2a2a2a;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.title span { color: #4caf50; }

.search-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #2a2a2a;
  border: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  text-decoration: none;
  color: #fff;
}
  </style>
</head>
<body>

  <div class="header">
  <div class="title">🎬 Кино<span>Тиндер</span></div>
  <a href="/search" class="search-btn">🔍</a>
</div>

  <div class="swipe-area">
    {% if film %}
      <div class="card" id="card"
           data-id="{{ film.id }}"
           data-title="{{ film.title }}"
           data-poster_path="{{ film.poster_path }}"
           data-release_date="{{ film.release_date }}"
           data-vote_average="{{ film.vote_average }}">
        {% if film.poster_path %}
          <img src="https://image.tmdb.org/t/p/w500{{ film.poster_path }}">
        {% endif %}
        <div class="card-info">
          <h2>{{ film.title }}</h2>
          <p>{{ film.release_date }}</p>
          <p class="rating">⭐ {{ film.vote_average }}</p>
        </div>

        <div class="stamp like" id="stampLike">❤️ ЛАЙК</div>
        <div class="stamp nope" id="stampNope">👎 НЕТ</div>
      </div>
    {% else %}
      <p>Фильмы не найдены</p>
    {% endif %}
  </div>

  <div class="bottom-nav">
    <a href="/" class="nav-item active">
      <span class="icon">🏠</span>Домой
    </a>
    <a href="/duel" class="nav-item">
      <span class="icon">⚔️</span>Дуэли
    </a>
    <a href="/favourites" class="nav-item">
      <span class="icon">❤️</span>Избранное
    </a>
  </div>

  <script>
    const card = document.getElementById('card');
    if (card) {
      let startX = 0, currentX = 0, isDragging = false;

      card.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        card.style.transition = 'none';
        card.setPointerCapture(e.pointerId);
      });

      card.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        currentX = e.clientX - startX;
        const rotation = currentX / 20;

        card.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;

        document.getElementById('stampLike').style.opacity =
          currentX > 30 ? Math.min(currentX / 100, 1) : 0;
        document.getElementById('stampNope').style.opacity =
          currentX < -30 ? Math.min(-currentX / 100, 1) : 0;
      });

      card.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        card.style.transition = 'transform 0.3s ease';

        if (currentX > 100) {
          // ЛАЙК
          card.style.transform = 'translateX(500px) rotate(30deg)';

          const id = card.dataset.id;
          const title = card.dataset.title;
          const poster = card.dataset.poster_path;
          const date = card.dataset.release_date;
          const rating = card.dataset.vote_average;

          setTimeout(() => {
            window.location.href =
              `/like?id=${id}&title=${encodeURIComponent(title)}&poster_path=${poster}&release_date=${date}&vote_average=${rating}`;
          }, 300);

        } else if (currentX < -100) {
          // ДИЗЛАЙК
          card.style.transform = 'translateX(-500px) rotate(-30deg)';
          setTimeout(() => window.location.href = '/', 300);

        } else {
          // Возврат
          card.style.transform = 'translateX(0) rotate(0)';
          document.getElementById('stampLike').style.opacity = 0;
          document.getElementById('stampNope').style.opacity = 0;
        }

        currentX = 0;
      });
    }
  </script>

</body>
</html>
